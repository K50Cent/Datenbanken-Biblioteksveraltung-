<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliotheksverwaltung</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .page-section {
      margin-bottom: 36px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #237a57;
      color: #1f2933;
    }
    .section-title span {
      color: #237a57;
    }
  </style>
</head>
<body>

<!-- ─── Navigation ────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <span class="navbar-brand">Bibliotheksverwaltung</span>
</nav>

<!-- ─── Hauptinhalt ───────────────────────────────────────────────────────── -->
<div class="container">

  <!-- Sektion 1: Empfehlungen -->
  <section class="page-section" id="recommendationsSection">
    <h2 class="section-title">
      Empfehlungen – Beliebteste Kategorie: <span id="recCategoryName">wird geladen…</span>
    </h2>
    <div id="recBooks" class="books-grid">
      <p style="color:#667786">Empfehlungen werden geladen…</p>
    </div>
  </section>

  <!-- Sektion 2: Bücher durchsuchen -->
  <section class="page-section" id="browseSection">
    <h2 class="section-title">Bücher durchsuchen</h2>

    <div class="search-bar">
      <div class="form-group">
        <label for="searchInput">Suche</label>
        <input id="searchInput" type="text">
      </div>
      <div class="form-group">
        <label for="categoryFilter">Kategorie</label>
        <select id="categoryFilter">
          <option value="">Alle Kategorien</option>
        </select>
      </div>
      <button id="searchBtn">Suchen</button>
    </div>

    <div id="booksList" class="books-grid">
      <p style="color:#667786">Bücher werden geladen…</p>
    </div>
  </section>

  <!-- Sektion 3: Aktive Ausleihen -->
  <section class="page-section" id="loansSection">
    <h2 class="section-title">Aktuelle Ausleihen</h2>
    <div id="loansContent">
      <p style="color:#667786">Ausleihen werden geladen…</p>
    </div>
  </section>

  <!-- ─── Admin-Bereich ───────────────────────── -->
<section id="adminSection" style="background:#fff; border:1px solid #d8dee4; border-radius:6px; padding:18px; margin-bottom:36px;">

  <h2 style="margin-bottom:18px">Admin-Bereich</h2>

  <h3 id="bookFormTitle">Neues Buch anlegen</h3>

  <form id="bookForm">
    <input type="hidden" id="editBookId">

    <div class="form-row">
      <div class="form-group">
        <label for="bookTitle">Titel *</label>
        <input id="bookTitle" type="text" required>
      </div>
      <div class="form-group">
        <label for="bookIsbn">ISBN *</label>
        <input id="bookIsbn" type="text" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="bookYear">Jahr *</label>
        <input id="bookYear" type="number" required>
      </div>
      <div class="form-group">
        <label for="bookCategory">Kategorie</label>
        <select id="bookCategory">
          <option value="">Keine Kategorie</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="bookAvailable">Verfügbare Exemplare</label>
        <input id="bookAvailable" type="number" min="0" value="1">
      </div>
      <div class="form-group">
        <label for="bookTotal">Gesamtanzahl Exemplare</label>
        <input id="bookTotal" type="number" min="1" value="1">
      </div>
    </div>

    <div class="form-group">
      <label for="bookAuthors">Autoren (Mehrfachauswahl möglich)</label>
      <select id="bookAuthors" multiple></select>
    </div>

    <div id="bookFormMsg"></div>

    <div class="form-actions" style="margin-top:12px">
      <button type="submit" id="bookSubmitBtn">Buch speichern</button>
      <button type="button" id="bookCancelBtn" hidden class="btn-outline">Abbrechen</button>
    </div>
  </form>

  <h3 style="margin-top:28px">Alle Bücher</h3>
  <div id="adminBookListContent">
    <p style="color:#667786">Wird geladen…</p>
  </div>

</section>

</div>

<!-- Toast-Container -->
<div id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
